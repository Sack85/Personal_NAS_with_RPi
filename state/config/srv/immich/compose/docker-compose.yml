# Immich v3.3.3 — compose oficial (releases/latest/download/docker-compose.yml, 2026-10-17)
# adaptado al HLD v3 §6, ADR-011. Fuente de verdad: state/config/srv/immich/compose/ (RBK 15 v3).
# Cambios frente al oficial: volúmenes del pool añadidos en immich-server con sintaxis larga
# y create_host_path: false (si el pool no está montado, el contenedor no arranca en lugar de
# escribir en el SSD).
name: immich

services:
  immich-server:
    container_name: immich_server
    user: "33:33"
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    volumes:
      - ${UPLOAD_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro
      - type: bind
        source: /srv/mergerfs/pool/Imagenes/Moviles
        target: /data/library
        bind:
          create_host_path: false
      - type: bind
        source: /srv/mergerfs/pool/Archivo/immich-db
        target: /data/backups
        bind:
          create_host_path: false
      - type: bind
        source: /srv/mergerfs/pool/Imagenes
        target: /mnt/imagenes
        read_only: true
        bind:
          create_host_path: false
    env_file:
      - .env
    ports:
      - '2283:2283'
    depends_on:
      - redis
      - database
    restart: always
    healthcheck:
      disable: false

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    volumes:
      - model-cache:/cache
    env_file:
      - .env
    restart: always
    healthcheck:
      disable: false

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
    restart: always

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always
    healthcheck:
      disable: false

volumes:
  model-cache:
