# RBK 17: reinicio automático si el disco del sistema deja tareas bloqueadas (estado D).
# Una tarea bloqueada >= 120 s provoca un panic y el kernel reinicia a los 10 s.
# El nombre 99-zz-... se ordena después de 99-openmediavault.conf (kernel.panic = 90, fichero
# del paquete openmediavault): en sysctl.d gana el nombre lexicográficamente mayor.
# Vuelta atrás: borrar este fichero y /usr/sbin/sysctl -w kernel.hung_task_panic=0 kernel.panic=90
kernel.hung_task_timeout_secs = 120
kernel.hung_task_panic = 1
kernel.panic = 10
