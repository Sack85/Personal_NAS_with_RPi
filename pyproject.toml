[project]
name = "nas2rbpi-agents"
version = "0.1.0"
description = "Sistema multiagéntico (plugins de Claude Code) para montar y mantener un NAS con Raspberry Pi 5"
requires-python = ">=3.10"
dependencies = [
    "jinja2>=3.1.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
    "pre-commit>=4.0.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# Copiado de RDEWAI casi literal; sus marcadores HTML son largos a propósito.
".claude/hooks/sync_learnings_to_claude_md.py" = ["E501"]
# Comandos de shell reales como datos de prueba.
"tests/test_ssh_guard.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"
