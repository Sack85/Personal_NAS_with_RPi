# Registro de roles y entregables. Fuente para tests, tools/sync_shared.py y tools/validate.py.
# Cada plugin añadido aquí debe existir en .claude-plugin/marketplace.json.
#
# plugins:
#   <nombre>-plugin:
#     role: Nombre del rol
#     wip: true                 # en construcción: los tests de estructura lo ignoran
#     deliverables:
#       <abbr>:                 # carpeta outputs/<abbr>/ y memory/<abbr>/
#         name: Nombre completo
#         prefix: ABBR          # ficheros ABBR-AAAA-MM-DD-<corto>.md
#         upstream: [abbr...]   # entregables que deben estar Aprobados antes
plugins:
  requirements-plugin:
    role: Analista de requisitos
    deliverables:
      nrd:
        name: Requisitos del NAS
        prefix: NRD
        upstream: []
  architect-plugin:
    role: Arquitecto
    deliverables:
      hld:
        name: Diseño de alto nivel
        prefix: HLD
        upstream: [nrd]
  runbook-plugin:
    role: Autor de runbooks
    deliverables:
      rbk:
        name: Runbook por fase
        prefix: RBK
        upstream: [hld]
  operator-plugin:
    role: Operador
    deliverables:
      ops:
        name: Registro de ejecución
        prefix: OPS
        upstream: [rbk, upd]
  maintainer-plugin:
    role: Mantenedor
    deliverables:
      upd:
        name: Plan de actualización
        prefix: UPD
        upstream: [hld]
      mnt:
        name: Informe de mantenimiento
        prefix: MNT
        upstream: [hld]
